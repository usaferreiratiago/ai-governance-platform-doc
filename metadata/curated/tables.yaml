# =====================================================================
# Curated Tables - Semantic Model
# =====================================================================
# This file defines all approved and governed tables in the semantic model.
# Tables must be reviewed and approved by the Data Governance Team.
# =====================================================================

version: 1.0.0
last_updated: 2026-08-13
status: Approved
domain: Retail & E-commerce

# =====================================================================
# Table Definitions
# =====================================================================
tables:
  # -----------------------------------------------------------------
  # Fact Tables
  # -----------------------------------------------------------------
  - name: Sales
    business_name: Retail Sales
    description: |
      Sales transactions used for revenue, margin, and profitability analysis.
      Contains detailed transaction-level data including quantity, price, discounts,
      and customer information.
    table_type: Fact
    schema: dbo
    owner: Retail Analytics
    owner_email: retail-analytics@company.com
    certified: true
    certification_date: 2026-07-01
    certified_by: Data Governance Team
    hidden: false
    sensitive: false
    contains_pii: false
    row_count_estimate: 1000000
    refresh_frequency: Daily
    refresh_time: 02:00 UTC
    granularity: Transaction
    primary_key: SalesOrderNumber
    foreign_keys:
      - ProductKey
      - CustomerKey
      - DateKey
      - AreaManagerCode
      - ItemCode
      - BusinessCode
    columns:
      - name: SalesOrderNumber
        data_type: string
        description: Unique identifier for each sales transaction
        is_primary_key: true
        nullable: false
      - name: ProductKey
        data_type: integer
        description: Foreign key to Product table
        nullable: false
      - name: CustomerKey
        data_type: integer
        description: Foreign key to Customer table
        nullable: false
      - name: DateKey
        data_type: integer
        description: Foreign key to Date table (YYYYMMDD format)
        nullable: false
      - name: AreaManagerCode
        data_type: integer
        description: Foreign key to Area Manager table
        nullable: true
      - name: ItemCode
        data_type: string
        description: Foreign key to ARTICOLI table (product master)
        nullable: true
      - name: BusinessCode
        data_type: string
        description: Foreign key to BUSINESS table (business classification)
        nullable: true
      - name: NetAmount
        data_type: decimal(18,2)
        description: Net sales amount after discounts and returns
        nullable: false
      - name: Quantity
        data_type: integer
        description: Number of units sold
        nullable: false
      - name: UnitPrice
        data_type: decimal(18,2)
        description: Price per unit before discounts
        nullable: false
      - name: DiscountAmount
        data_type: decimal(18,2)
        description: Total discount applied to the transaction
        nullable: true
      - name: ReturnIndicator
        data_type: boolean
        description: Indicates if the transaction was a return
        nullable: false
        default: false
    usage_guidance: |
      This is the primary fact table for all sales analytics.
      Always join to Date, Product, and Customer dimensions for complete analysis.
      Use with certified measures for revenue, margin, and volume analysis.
    examples:
      - "Sales by Product Category for Q2 2026"
      - "Top 10 Customers by Revenue"
      - "Monthly Sales Trend with YoY Growth"
      - "Sales by Area Manager"
      - "Sales by Color"
      - "Sales by Collection"
      - "Sales by Category"
      - "Sales by Gender"
      - "Sales by Business"
      - "Sales by Macro Business"
    tags:
      - fact
      - sales
      - revenue
      - core
    related_tables:
      - Product
      - Customer
      - Date
      - AREA_MANAGER
      - ARTICOLI_COLORE
      - ARTICOLI
      - BUSINESS
      - CALENDARIO
    mandatory_filters:
      - Date
    security:
      row_level_security: false
      object_level_security: false
      access_level: Standard
    data_quality_rules:
      - rule: No_Null_NetAmount
        description: NetAmount must never be null
        severity: Critical
      - rule: Quantity_Positive
        description: Quantity must be greater than zero for sales (non-returns)
        severity: High
      - rule: Valid_DateKey
        description: DateKey must exist in Date table
        severity: Critical

  # -----------------------------------------------------------------
  # Dimension Tables
  # -----------------------------------------------------------------
  - name: Customer
    business_name: Customer
    description: |
      Customer master data used for segmentation, analytics, and customer 360 views.
      Contains demographic information, customer segments, and contact details.
    table_type: Dimension
    schema: dbo
    owner: CRM Analytics
    owner_email: crm-analytics@company.com
    certified: true
    certification_date: 2026-07-01
    certified_by: Data Governance Team
    hidden: false
    sensitive: true
    contains_pii: true
    row_count_estimate: 50000
    refresh_frequency: Weekly
    refresh_time: 04:00 UTC
    granularity: Customer
    primary_key: CustomerKey
    foreign_keys: []
    columns:
      - name: CustomerKey
        data_type: integer
        description: Unique identifier for each customer
        is_primary_key: true
        nullable: false
      - name: CustomerName
        data_type: string
        description: Full name of the customer
        nullable: false
        pii: true
      - name: Email
        data_type: string
        description: Customer email address
        nullable: true
        pii: true
      - name: Phone
        data_type: string
        description: Customer phone number
        nullable: true
        pii: true
      - name: Region
        data_type: string
        description: Geographic region where customer is located
        nullable: false
      - name: Segment
        data_type: string
        description: Customer segment (e.g., Premium, Standard, Enterprise)
        nullable: false
      - name: CustomerType
        data_type: string
        description: Type of customer (e.g., Individual, Corporate, Partner)
        nullable: false
      - name: CreatedDate
        data_type: date
        description: Date when customer was first created
        nullable: false
      - name: Active
        data_type: boolean
        description: Indicates if customer is currently active
        nullable: false
        default: true
    usage_guidance: |
      Use this table for customer segmentation, retention analysis, and customer lifetime value calculations.
      Contains PII - handle with care and follow data privacy regulations.
      Always ensure customer data is aggregated before sharing externally.
    examples:
      - "Customer Count by Segment"
      - "Top 10 Customers by Revenue"
      - "Customer Retention Rate by Month"
    tags:
      - dimension
      - customer
      - crm
      - master_data
    related_tables:
      - Sales
    mandatory_filters:
      - Date (via Sales)
    security:
      row_level_security: true
      object_level_security: true
      access_level: Restricted
      pii_handling: Anonymized after 90 days of inactivity
    data_quality_rules:
      - rule: Unique_Email
        description: Email addresses must be unique across customers
        severity: High
      - rule: Not_Null_Key
        description: CustomerKey must never be null
        severity: Critical
      - rule: Valid_Region
        description: Region must be one of the approved regions
        severity: Medium

