        severity: Medium

  - name: Date
    business_name: Calendar
    description: |
      Corporate calendar table used for time intelligence, time-based comparisons,
      and date-based filtering across all fact tables.
      Includes both fiscal and calendar year hierarchies.
    table_type: Dimension
    schema: dbo
    owner: BI Platform
    owner_email: bi-platform@company.com
    certified: true
    certification_date: 2026-07-01
    certified_by: Data Governance Team
    hidden: false
    sensitive: false
    contains_pii: false
    row_count_estimate: 3650
    refresh_frequency: Monthly
    refresh_time: 01:00 UTC (first of month)
    granularity: Day
    primary_key: DateKey
    foreign_keys: []
    columns:
      - name: DateKey
        data_type: integer
        description: Unique date identifier in YYYYMMDD format (e.g., 20260730)
        is_primary_key: true
        nullable: false
      - name: CalendarDate
        data_type: date
        description: Full date value (YYYY-MM-DD)
        nullable: false
      - name: CalendarYear
        data_type: integer
        description: Calendar year (e.g., 2026)
        nullable: false
      - name: CalendarMonth
        data_type: integer
        description: Calendar month number (1-12)
        nullable: false
      - name: CalendarMonthName
        data_type: string
        description: Full month name (e.g., July)
        nullable: false
      - name: CalendarQuarter
        data_type: integer
        description: Calendar quarter number (1-4)
        nullable: false
      - name: CalendarWeek
        data_type: integer
        description: Week number within the year (1-52)
        nullable: false
      - name: FiscalYear
        data_type: integer
        description: Fiscal year (e.g., 2026)
        nullable: false
      - name: FiscalQuarter
        data_type: integer
        description: Fiscal quarter number (1-4)
        nullable: false
      - name: DayOfWeek
        data_type: integer
        description: Day of week number (1-7, Monday=1)
        nullable: false
      - name: DayName
        data_type: string
        description: Full name of the day (e.g., Monday)
        nullable: false
      - name: IsWeekend
        data_type: boolean
        description: Indicates if the day is a weekend
        nullable: false
        default: false
      - name: IsHoliday
        data_type: boolean
        description: Indicates if the day is a corporate holiday
        nullable: false
        default: false
    usage_guidance: |
      This table must be joined to all fact tables for time-based analysis.
      Supports both calendar and fiscal year hierarchies.
      Use for YoY, QoQ, MoM comparisons and trend analysis.
      Always filter by DateKey or CalendarDate.
    examples:
      - "Sales by Month"
      - "Year-over-Year Growth"
      - "Seasonal Sales Patterns"
    tags:
      - dimension
      - date
      - time
      - calendar
    related_tables:
      - Sales
    mandatory_filters:
      - DateKey
    security:
      row_level_security: false
      object_level_security: false
      access_level: Standard
    data_quality_rules:
      - rule: Unique_Dates
        description: DateKey must be unique and represent a valid date
        severity: Critical
      - rule: Continuous_Dates
        description: No gaps in date sequence (daily continuity)
        severity: High
      - rule: Valid_Range
        description: Dates must be between 2010-01-01 and 2030-12-31
        severity: High

  - name: ACTIVE_CUSTOMER_MONTH
    business_name: Active Customer Month
    description: |
      Customer activity tracking by month and year.
      Contains customer tier information and activity metrics for active customer analysis.
      Tracks customer retention and tier progression over time.
    table_type: Dimension
    schema: dbo
    owner: CRM Analytics
    owner_email: crm-analytics@company.com
    certified: true
    certification_date: 2026-08-12
    certified_by: Data Governance Team
    hidden: false
    sensitive: false
    contains_pii: false
    row_count_estimate: 50000
    refresh_frequency: Daily
    refresh_time: 02:00 UTC
    granularity: Customer-Month
    primary_key: CLI_DWH_KEY
    foreign_keys: []
    columns:
      - name: ANNO_COD
        business_name: Year Code
        data_type: string
        description: Year code for the customer activity (e.g., 2022, 2023)
        nullable: false
        is_primary_key: false
      - name: MESE_COD
        business_name: Month Code
        data_type: string
        description: Month code for the customer activity (e.g., 01, 02)
        nullable: false
        is_primary_key: false
      - name: YEAR_CUST_TYPE_DES
        business_name: Year Customer Type
        data_type: string
        description: Customer type description by year
        nullable: true
        is_primary_key: false
      - name: CLI_DWH_KEY
        business_name: Customer DWH Key
        data_type: double
        description: Customer data warehouse key - unique identifier for each customer
        nullable: false
        is_primary_key: true
      - name: TIER_YTD_COD
        business_name: Tier YTD Code
        data_type: string
        description: Customer tier code year-to-date (e.g., GOLD, SILVER, BRONZE)
        nullable: true
        is_primary_key: false
      - name: Tier Label
        business_name: Tier Label
        data_type: string
        description: Customer tier label with year-over-year comparison indicator (Δ vs LY)
        nullable: true
        is_primary_key: false
    usage_guidance: |
      Use this table for customer activity analysis, tier progression tracking, and retention analysis.
      Track customer tier changes over time using ANNO_COD (Year) and MESE_COD (Month).
      The Tier Label column includes Δ vs LY to show year-over-year tier changes.
    examples:
      - "Show active customers by tier"
      - "Customer tier progression over months"
      - "Active customer count by year-month"
      - "Show customers who upgraded tiers"
    tags:
      - dimension
      - customer
      - activity
      - tier
      - retention
    related_tables:
      - Customer
    mandatory_filters:
      - Date
      - Organization
    security:
      row_level_security: false
      object_level_security: false
      access_level: Standard
    data_quality_rules:
      - rule: Not_Null_Key
        description: CLI_DWH_KEY must never be null
        severity: Critical
      - rule: Valid_Year
        description: ANNO_COD must be a valid year (e.g., 2022, 2023, 2024)
        severity: High
      - rule: Valid_Month
        description: MESE_COD must be between 01 and 12
        severity: High

